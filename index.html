<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ProGymnastics">
  <title>ProGymnastics México</title>
  <link rel="icon" href="img/icono-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .top { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 560px; margin: 0 auto;
           padding: calc(var(--seguro-arriba) + 8px) 12px 0; min-height: 44px; }
    .top img { width: 34px; height: 34px; border-radius: 8px; }
    .top button { border: 0; background: none; color: var(--tinte); font-size: 17px; min-height: 44px; padding: 0 8px; cursor: pointer; }
    .portada { width: 100%; max-width: 560px; margin: 0 auto; padding: calc(var(--seguro-arriba) + 28px) 24px 8px; text-align: center; }
    .logo-caja { width: min(300px, 78vw); margin: 0 auto; background: #fff; border-radius: 26px; padding: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.1); }
    .logo-caja img { display: block; width: 100%; height: auto; }
    .portada h1 { margin: 22px 0 4px; font-size: 28px; font-weight: 700; }
    .portada p { margin: 0; color: var(--muted); font-size: 15px; }
    .entrar { width: 100%; max-width: 420px; margin: 0 auto; padding: 20px 16px 32px; }
    .campos { background: var(--panel); border-radius: 12px; overflow: hidden; }
    .campos label { flex-direction: row; align-items: center; gap: 0; padding-left: 16px; color: var(--fg); font-size: 17px; position: relative; }
    .campos label span { flex: 0 0 104px; }
    .campos label + label::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--line); }
    .campos input { background: transparent; border-radius: 0; padding-left: 0; }
    .campos input:focus { outline: none; }
    .entrar .btn { width: 100%; margin-top: 16px; min-height: 50px; border-radius: 14px; }
    .enlaces { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 14px; }
    .enlaces button, .enlaces a { background: none; border: 0; padding: 8px; color: var(--tinte); font-size: 15px; cursor: pointer; }
    .error { color: var(--bad); font-size: 15px; min-height: 1.2em; margin: 10px 4px 0; text-align: center; }
    .hola { width: 100%; max-width: 560px; margin: 0 auto; padding: 6px 20px 14px; }
    .hola h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .01em; }
    .hola p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
    .logo-mini { width: calc(100% - 32px); max-width: 528px; margin: 0 auto 22px; background: #fff; border-radius: 18px; padding: 6px; box-shadow: var(--sombra); }
    .logo-mini img { display: block; width: 100%; height: auto; }
    .globo { flex: none; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--rojo); color: #fff; font-size: 14px; font-weight: 600; display: grid; place-items: center; }
    footer { margin-top: auto; padding: 16px 16px calc(16px + var(--seguro-abajo)); text-align: center; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <!-- Entrar -->
  <div id="sec-entrada">
    <div class="portada">
      <div class="logo-caja"><img src="img/logo-ancho.jpg" alt="ProGymnastics México" width="1100" height="700"></div>
      <h1 id="entrada-titulo">Bienvenido</h1>
      <p id="entrada-sub">Entra con tu correo del club</p>
    </div>

    <!-- Entrar con Firebase -->
    <section class="entrar oculto" id="sec-login">
      <form id="f-login">
        <div class="campos">
          <label><span>Correo</span><input type="email" id="l-email" autocomplete="email" placeholder="nombre@correo.com" required></label>
          <label><span>Contraseña</span><input type="password" id="l-clave" autocomplete="current-password" placeholder="Obligatoria" required></label>
        </div>
        <p class="error" id="l-error" role="alert"></p>
        <button class="btn principal" type="submit" id="l-btn">Entrar</button>
        <div class="enlaces">
          <button type="button" id="l-crear">Crear mi cuenta (con invitación)</button>
          <button type="button" id="l-olvide">Olvidé mi contraseña</button>
          <a href="?demo">Ver la demostración</a>
        </div>
      </form>
    </section>

    <!-- Entrar en modo demostración -->
    <section class="entrar oculto" id="sec-demo">
      <div class="grupo-lista" style="padding:0"><h3>Elige un perfil</h3><ul class="lista" id="demo-perfiles"></ul></div>
      <p class="nota" style="margin:8px 16px 0">Datos inventados que se guardan solo en este navegador.</p>
      <div class="enlaces">
        <button type="button" id="demo-reiniciar" style="color:var(--bad)">Borrar datos de demostración</button>
        <a class="oculto" href="./" id="demo-salir-a">Salir de la demostración</a>
      </div>
    </section>
  </div>

  <!-- Inicio: íconos como en la pantalla de inicio del iPhone -->
  <section class="oculto" id="sec-menu">
    <div class="top"><img src="img/icono-192.png" alt=""><button type="button" id="btn-salir">Salir</button></div>
    <div class="hola"><h1 id="hola-nombre"></h1><p id="hola-rol"></p></div>
    <div class="logo-mini"><img src="img/logo-ancho.jpg" alt="ProGymnastics México" width="1100" height="700"></div>
    <div class="grupo-lista" id="fila-avisos" style="max-width:560px;margin-bottom:22px"></div>
    <nav class="menu" id="menu" aria-label="Apartados"></nav>
  </section>

  <footer>© <span id="anio"></span> ProGymnastics México</footer>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/avisos.js"></script>
  <script>
  (async function () {
    const $ = (id) => document.getElementById(id);
    $("anio").textContent = new Date().getFullYear();

    // Inicio (como aguilaskc.net): una tarjeta por sección y, para administración, sus dos apartados.
    async function mostrarMenu(u) {
      $("sec-entrada").classList.add("oculto"); $("sec-menu").classList.remove("oculto");
      $("hola-nombre").textContent = "Hola, " + (u.nombre || "").split(" ")[0];
      $("hola-rol").textContent = (Sesion.ROLES[u.rol] || u.rol) + " · " + u.nombre;
      $("btn-salir").onclick = () => { if (confirm("¿Cerrar la sesión?")) Sesion.salir(""); };
      const atletas = Sesion.esStaff(u) ? [] : await Sesion.atletasVisibles(u).catch(() => []);
      const secs = Sesion.seccionesDe(u, atletas);
      const tarjetas = CLUB.secciones.filter((x) => secs.includes(x.id)).map((x) =>
        ({ href: x.id.toLowerCase() + "/", ico: x.id, texto: true, t: x.id, s: x.nombre }));
      if (Sesion.puede.herramientasAdmin(u)) tarjetas.push({ href: "admin/", icono: "carpeta", color: "gris", t: "Herramientas", s: "Pagos, altas y bajas" });
      if (Sesion.puede.accesos(u)) tarjetas.push({ href: "modulos/equipo/?vista=accesos", icono: "candado", color: "azul", t: "Acceso", s: "Administración de acceso: quién entra y qué puede ver" });
      // Fila de notificaciones (contador de avisos nuevos y si este celular ya las recibe).
      Promise.all([Avisos.nuevos(u).catch(() => 0), Avisos.estado("")]).then(([n, est]) => {
        $("fila-avisos").innerHTML = `<ul class="lista"><li><a href="modulos/notificaciones/"><span class="icono" style="background:var(--rojo)">${UI.icono("megafono")}</span>
          <span class="txt"><b>Notificaciones</b><small>${est === "activo" ? "Activas en este celular" : est === "demo" ? "Avisos de pagos y recordatorios" : "Actívalas para recibir avisos de pagos"}</small></span>
          ${n ? `<span class="globo">${n}</span>` : ""}${UI.chevron}</a></li></ul>`;
      });
      $("menu").innerHTML = tarjetas.length ? tarjetas.map((m) =>
        `<a class="tarjeta" href="${m.href}" aria-label="${UI.esc(m.t + ": " + m.s)}"><span class="ico${m.texto ? " texto" : ""}" style="${m.color ? `background:var(--${m.color})` : ""}" aria-hidden="true">${m.texto ? UI.esc(m.ico) : UI.icono(m.icono)}</span><strong>${UI.esc(m.t)}</strong></a>`).join("")
        : `<p class="vacio" style="grid-column:1/-1">Tu cuenta todavía no tiene atletas ni secciones asignadas. Pídelo a Administración.</p>`;
    }

    if (DB.DEMO) {
      const u = await Sesion.actual();
      if (u) return await mostrarMenu(u);
      $("sec-demo").classList.remove("oculto");
      const us = await DB.listar("usuarios");
      const orden = ["SUPER", "OWNER", "ADMIN", "COACH", "TUTOR", "ATLETA"];
      us.sort((a, b) => orden.indexOf(a.rol) - orden.indexOf(b.rol));
      const COLOR = { SUPER: "indigo", OWNER: "morado", ADMIN: "azul", COACH: "verde", TUTOR: "naranja", ATLETA: "cian" };
      $("entrada-titulo").textContent = "Demostración"; $("entrada-sub").textContent = "Entra con un perfil de prueba";
      $("demo-perfiles").innerHTML = us.map((x) => `<li><a href="#" data-uid="${UI.esc(x.id)}"><span class="icono" style="background:var(--${COLOR[x.rol] || "gris"})">${UI.icono("personas")}</span>
        <span class="txt"><b>${UI.esc(Sesion.ROLES[x.rol])}</b><small>${UI.esc(x.nombre)}</small></span>${UI.chevron}</a></li>`).join("");
      $("demo-perfiles").onclick = async (e) => {
        const b = e.target.closest("[data-uid]"); if (!b) return; e.preventDefault();
        localStorage.setItem("pg_demo_uid", b.dataset.uid); await mostrarMenu(await Sesion.actual());
      };
      if (window.FIREBASE_CONFIG) {
        $("demo-salir-a").classList.remove("oculto");
        $("demo-salir-a").onclick = () => { try { sessionStorage.removeItem("pg_demo"); } catch (e) {} localStorage.removeItem("pg_demo_uid"); };
      }
      $("demo-reiniciar").onclick = () => { if (confirm("¿Borrar todos los datos de demostración?")) { DB.reiniciar(); localStorage.removeItem("pg_demo_uid"); location.reload(); } };
      return;
    }

    // ---- Firebase ----
    const auth = firebase.auth();
    const err = (m) => { $("l-error").textContent = m || ""; };
    const MENSAJES = {
      "auth/invalid-email": "El correo no es válido.",
      "auth/user-not-found": "No hay cuenta con ese correo. Si tienes invitación, usa «Crear mi cuenta».",
      "auth/wrong-password": "Contraseña incorrecta.",
      "auth/invalid-login-credentials": "Correo o contraseña incorrectos.",
      "auth/email-already-in-use": "Ese correo ya tiene cuenta: entra con tu contraseña.",
      "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
      "auth/too-many-requests": "Demasiados intentos. Espera unos minutos."
    };
    const msg = (e) => MENSAJES[e.code] || e.message || "No se pudo completar.";

    try { const u = await Sesion.actual(); if (u) return await mostrarMenu(u); }
    catch (e) { err(e.message); }
    $("sec-login").classList.remove("oculto");

    $("f-login").onsubmit = async (e) => {
      e.preventDefault(); err(""); $("l-btn").disabled = true;
      try {
        await auth.signInWithEmailAndPassword($("l-email").value.trim(), $("l-clave").value);
        mostrarMenu(await Sesion.actual());
      } catch (x) { err(msg(x)); } finally { $("l-btn").disabled = false; }
    };
    $("l-crear").onclick = async () => {
      err(""); const email = $("l-email").value.trim().toLowerCase(), clave = $("l-clave").value;
      if (!email || clave.length < 6) return err("Escribe tu correo (el de la invitación) y una contraseña de al menos 6 caracteres; luego toca «Crear mi cuenta».");
      try { await auth.createUserWithEmailAndPassword(email, clave); mostrarMenu(await Sesion.actual()); }
      catch (x) { err(x.code ? msg(x) : x.message); }
    };
    $("l-olvide").onclick = async () => {
      const email = $("l-email").value.trim();
      if (!email) return err("Escribe tu correo y vuelve a tocar «Olvidé mi contraseña».");
      try { await auth.sendPasswordResetEmail(email); err(""); alert("Te enviamos un correo para crear una contraseña nueva."); }
      catch (x) { err(msg(x)); }
    };
  })();
  </script>
</body>
</html>
